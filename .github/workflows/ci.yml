name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cashback
          POSTGRES_USER: cashback
          POSTGRES_PASSWORD: cashback
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cashback -d cashback"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://cashback:cashback@127.0.0.1:5432/cashback
      RUST_LOG: cashback_rewards_rust=info
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
