services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: cashback
      POSTGRES_USER: cashback
      POSTGRES_PASSWORD: cashback
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashback -d cashback"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://cashback:cashback@postgres:5432/cashback
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: cashback_rewards_rust=info,tower_http=info
    ports:
      - "8080:8080"
